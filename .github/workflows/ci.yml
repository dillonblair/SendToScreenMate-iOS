name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")])
          for runtime in reversed(ios):
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "SIMULATOR=$UDID" >> "$GITHUB_ENV"

      - name: Build and test (unsigned)
        run: |
          set -o pipefail
          xcodebuild test \
            -project SendToScreenMate.xcodeproj \
            -scheme SendToScreenMate \
            -destination "id=$SIMULATOR" \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|Test Case|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
